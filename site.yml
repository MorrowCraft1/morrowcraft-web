# ============================================================
# MorrowCraft website content. EVERYTHING you can edit is in this file.
# Edit it on GitHub: click the pencil icon, change the text, Commit changes.
# The site updates in a minute or two.
# Rules for YAML: keep the spaces at the start of lines exactly as they are,
# do not use tabs, and wrap text in quote marks if it contains a colon (:) or starts with # or *.
# If the site shows "site.yml has a mistake", it tells you the line number.
# ============================================================
# ----------------------------------------------------------------------
# Server name. Shows in the header, footer and the browser tab ("MorrowCraft | Home").
name: MorrowCraft
# ----------------------------------------------------------------------
# The paragraph on the Home page.
intro: MorrowCraft is a semi-vanilla survival server designed for both competitive PvP and chill gameplay. There are cool unique features that make the server fun so come check it out!
# ----------------------------------------------------------------------
# Logo file. To change it, upload a new picture to the assets folder and put its path here.
logo: /assets/logo.png
# ----------------------------------------------------------------------
# Brand colours. Anything with a # is a hex colour code.
colors:
  red: '#e90c09'
  redDeep: '#9f0809'
  green: '#55dd33'
  greenDeep: '#22aa22'
  bg: '#080d22'
  bgLeft: '#2e080d'
  bgRight: '#08301a'
  shell: '#0c1331'
  surface: '#121c42'
  surface2: '#1a2759'
  line: '#27376f'
  text: '#e9edf9'
  muted: '#9aa5c8'
# ----------------------------------------------------------------------
# The tab bar. Order here = order on the site. Keep the ids the same (home, join, news ...). Only change the label.
# If you add a brand new tab you also need a page for it in app.js, so ask Claude.
tabs:
  - id: home
    label: Home
  - id: join
    label: How to Join
  - id: news
    label: News
  - id: leaderboard
    label: Leaderboard
  - id: staff
    label: Staff
  - id: ranks
    label: Ranks
  - id: wiki
    label: Wiki
  - id: rules
    label: Rules
  - id: faq
    label: FAQ
# ----------------------------------------------------------------------
# Server address, port and version. {javaHost} {bedrockHost} {bedrockPort} {version} can be used in any text below and are filled in automatically.
server:
  javaHost: play.morrowcraft.net
  bedrockHost: play.morrowcraft.net
  bedrockPort: 19132
  version: '26.2'
  versionNote: 'Older Java versions can join too, thanks to ViaVersion.'
  statusRefreshSeconds: 60
# ----------------------------------------------------------------------
# Links. Used by the buttons and any text that says link: store / discord / voice.
links:
  store: 'https://store.morrowcraft.net'
  discord: 'https://discord.morrowcraft.net'
  voice: 'https://voice.morrowcraft.net'
  applications: 'https://discord.com/channels/1102069205290975325/1438255195199901767'
  email: support@morrowcraft.net
# ----------------------------------------------------------------------
# Where the auto-updating files live. Leave as it is.
data:
  base: /data/
# ----------------------------------------------------------------------
# The three cards under the connect box on Home. tone is red or green. link is the name of an entry in links above.
tiles:
  - title: Store
    text: Ranks and crate keys. Everything is optional and pays for upkeep. Ranks are built to not be pay to win.
    cta: Visit the store
    link: store
    tone: green
  - title: Discord
    text: 'Tickets, applications, announcements and the community. Join to get support and find players.'
    cta: Join the Discord
    link: discord
    tone: red
  - title: Voice chat
    text: Proximity voice chat for Java and Bedrock from your browser. Log in with your link from the game.
    cta: Open voice chat
    link: voice
    tone: green
# ----------------------------------------------------------------------
# FEATURES LIST on the Home page.
# To add one: copy a whole block (from "- title" down to its last line), paste it under the last one, change the words.
# To add a picture: upload it to the assets folder on GitHub, then add a line   image: /assets/yourpicture.png   to that feature.
# Delete the image line (or leave it out) for a feature with no picture.
features:
  - title: Java + Bedrock
    text: 'Play from PC, console or phone. Everyone plays on the same server.'
    image: ''
  - title: Proximity voice chat
    text: Talk to players near you in game. Works for Java and Bedrock.
    image: ''
  - title: Land claims
    text: Use a Golden Shovel or `/claim` to protect your builds. You earn claim blocks just by playing.
    image: ''
  - title: Teams of 5
    text: Team up with up to four others. Team leaderboards track who is on top.
    image: ''
  - title: Ranked PvP
    text: 'Elo, tiers and kill streaks are tracked for every player and shown on the leaderboard.'
    image: ''
  - title: Diamonds and Roses
    text: Two currencies power the server economy. Both have their own leaderboard.
    image: ''
# ----------------------------------------------------------------------
# HOW TO JOIN page. Each entry is a tab. Steps can use `code`, **bold**, [text](link) and the {javaHost} style fill-ins.
# Console video link: in the Bedrock entry set  links:  to a list, for example
#   links:
#     - label: Console video guide
#       url: https://youtube.com/...
join:
  - id: java
    label: Java Edition
    copy:
      - label: Server address
        value: '{javaHost}'
    steps:
      - Open Minecraft Java Edition and choose **Multiplayer**.
      - Click **Add Server** and paste the address.
      - 'Join on version `{version}`. {versionNote}'
  - id: bedrock
    label: Bedrock Edition
    copy:
      - label: Server address
        value: '{bedrockHost}'
      - label: Port
        value: '{bedrockPort}'
    steps:
      - 'Open Minecraft Bedrock and go to **Play, Servers, Add Server**.'
      - 'Enter any name, then the address and the port.'
      - Join the server. You do not need a Java account.
      - 'Consoles hide the Add Server button, so Xbox, PlayStation and Switch players may need a workaround such as BedrockConnect.'
    links: []
  - id: voice
    label: Voice chat
    copy:
      - label: Voice website (Bedrock)
        value: 'https://voice.morrowcraft.net'
    sections:
      - heading: Java Edition
        steps:
          - 'Install the [Simple Voice Chat](https://modrinth.com/plugin/simple-voice-chat) mod for your Minecraft version and mod loader (Fabric, Forge, NeoForge or Quilt).'
          - Join the server with the mod installed.
          - Press `V` in game to open the voice chat menu and set up your microphone.
      - heading: Bedrock Edition
        steps:
          - Join the server and type `/svg` in chat. A menu opens in game.
          - 'Click **Set password** and pick your own password. It can be anything, but make sure you remember it.'
          - 'On your computer or phone, go to [voice.morrowcraft.net](https://voice.morrowcraft.net).'
          - 'Enter your password and your username with a `*` in front of it, for example `*Username`, then connect.'
          - Keep the website open and the game open at the same time. Voice chat only works while both are running.
