# ----------------------------------------------------------------------
# WIKI page: one accordion per server system. To add one, copy a block ("- title:" down to its last line).
# body is a list of paragraphs. Text can use `code`, **bold** and [link](url).
wiki:
  intro: How the custom parts of MorrowCraft work.
  entries:
    - title: Diamonds and Roses
      sub: The two currencies
      body:
        - 'MorrowCraft has two currencies, **Diamonds** and **Roses**. Each one has its own leaderboard, so you can see who has the most.'
        - 'Keep your diamonds in `/bank`. You need them there to bid at Black Market auctions.'
    - title: Black Market auctions
      sub: Bid on rare custom items
      body:
        - 'Black Market auctions are hosted by the owner and announced in the News tab and on Discord. Bring your diamonds in `/bank`, then bid on custom items such as OP custom enchantments.'
        - 'Use `/warp BlackMarket` to get to the auction area.'
    - title: Teams of 5
      sub: Play together
      body:
        - 'Team up with up to four other players. Team leaderboards track which team is on top.'
    - title: Ranked PvP and Elo
      sub: Elo, tiers and streaks
      body:
        - 'Every player has an **Elo** rating and a **tier** that change as you win and lose ranked fights. Kill streaks and kills are tracked too.'
        - 'Check the Leaderboard tab to see where you stand.'
    - title: Custom enchantments
      sub: Rare enchantments you cannot find in vanilla
      body:
        - 'The server has custom enchantments on top of the vanilla ones. The strongest are sold at Black Market auctions.'
        - 'Details for each enchantment will be added here.'
    - title: Land claims
      sub: Protect your builds
      body:
        - 'Use a Golden Shovel or `/claim` to protect your builds. You earn claim blocks just by playing.'
