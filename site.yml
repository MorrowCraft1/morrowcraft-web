# ----------------------------------------------------------------------
# RULES page. Each section has a title and a list of rules.
rules:
  intro: 'To keep MorrowCraft clean, fair and running smoothly, everyone must follow these rules.'
  warning: 'Breaking the rules can lead to warnings, temporary mutes or permanent bans, depending on how serious it is and how often it happens. Staff may also act on things not listed here.'
  report: 'To report someone, open a report ticket in the tickets channel on our Discord.'
  sections:
    - id: community
      title: Community Guidelines
      sub: Discord and general behaviour
      numbered: true
      items:
        - title: Respect & language
          text: 'Treat everyone with kindness. No harassment, bullying, threats, trolling or offensive or hateful language.'
        - title: Keep it PG
          text: 'No adult, explicit or NSFW content (messages, images or links).'
        - title: No spam or ads
          text: 'No excessive self-promotion, advertising or spamming.'
        - title: Privacy
          text: 'Never share personal details (yours or anyone else''s), including real names and IP addresses.'
        - title: Staff & Discord
          text: Follow staff instructions and abide by Discord's Terms of Service.
        - title: Discord's Community Guidelines
          text: Abide by Discord's Terms of Service and Community Guidelines at all times.
        - title: Use common sense
          text: 'Use some common sense, or ask staff before you do something you believe could get you punished.'
    - id: minecraft
      title: Minecraft Rules
      sub: How we play
      numbered: true
      items:
        - title: Voice chat
          text: 'Keep it clean, including in groups. Moderate swearing is allowed.'
        - title: Hacks & cheats
          text: 'Hacked clients, X-ray and unauthorized mods are strictly banned.'
        - title: Exploits & dupes
          text: 'No abusing bugs or duplication methods, including string dupers. Report them through a ticket immediately.'
        - title: Alt accounts
          text: 'Alts are only allowed for AFKing farms. Never use alts to infiltrate bases, befriend players to kill them, or evade bans. Ban evasion adds up to 7 extra days.'
        - title: Abuse & impersonation
          text: No harassment or sexual harassment of members or staff. Do not impersonate staff.
        - title: Appeals
          text: Ban appeals must include evidence to be considered.
    - id: gameplay
      title: Gameplay Rules
      sub: 'PvP, teams and rare items'
      numbered: true
      items:
        - title: No kill farming
          text: 'No using alts, waiting out reward cooldowns or kill trading.'
        - title: Combat rules
          text: 'No danger logging, which means leaving the game when in danger. Using `/spawn` or other teleport methods to escape is fine. Do not kill players who are lagging out, it is unfair.'
        - title: Newbie protection
          text: Do not bypass newbie protection using lava or other indirect methods.
        - title: 'Rare items (Mace, BMEs, Legendaries)'
          text: 'Rare items must stay in your active inventory or a teammate''s inventory. No stashing in chests, ender chests or alts. Exception: BME books can be stored if they are not applied to an item. BME items must be renamed to the enchant. (BME = Black Market Enchantments)'
        - title: Item safety
          text: 'Do not destroy rare items or use Curse of Vanishing. You may sell them, but the item must return to your inventory if you leave spawn.'
        - title: Teams
          text: 'Maximum team size is 5. No cross-teaming, helping outsiders or double teaming enemies.'
        - title: No stasis chambers
          text: 'Stasis chambers are completely banned, for both PvP and travel.'
        - title: Griefing
          text: 'Griefing, stealing or breaking player builds outside of spawn is allowed.'
    - id: spawn
      title: Plots & Spawn
      sub: Keeping spawn tidy
      numbered: true
      items:
        - title: Prohibited at spawn
          text: 'No mob spawners, villager setups or trading halls, valuables storage, or redstone clocks (lag machines).'
        - title: Build standards
          text: 'Low effort or ugly builds (cobble boxes, random towers, lava casts, border wall blocks) will be removed by staff.'
        - title: Economy & interaction
          text: 'No scamming, stealing or griefing within the spawn region.'
        - title: AFK policy
          text: Water loops are allowed. Auto clickers used to bypass the AFK timer are banned.
        - title: Near spawn
          text: 'No lava casts, massive walls or blocking off the spawn area. This includes breaking massive amounts of blocks.'
        - title: Pushing players
          text: 'Do not push anyone outside of spawn. If a mob pushes someone out, do not kill them.'
    - id: mods
      title: Clients & Mods
      sub: What you can and cannot run
      numbered: false
      items:
        - heading: Allowed mods & clients
          tone: allow
          text: Others may be allowed too. Ask staff if you are unsure.
        - title: Approved clients
          tone: allow
          text: 'Feather, Lunar and Badlion, as long as you do not enable any disallowed features in them.'
        - title: Performance
          tone: allow
          text: 'Mods that improve stability and FPS are encouraged, such as Optifine, Sodium, Lithium, Phosphor and similar.'
        - title: PvP enhancements
          tone: allow
          text: 'HUD elements that show status information: shield status, keystrokes, armor HUD, ping display, potion status and custom crosshairs.'
        - title: Visuals
          tone: allow
          text: 'Fullbright, shulker box tooltips, low fire and low shield overlays, minimal particles and no hurt cam.'
        - title: Building & quality of life
          tone: allow
          text: 'Litematica or Schematica (holograms only), AppleSkin, Remove Loading Screen and Replay Mod (content use only).'
        - heading: Disallowed mods & clients
          tone: deny
          text: Others may be disallowed too. Ask staff if you are unsure.
        - title: Clients
          tone: deny
          text: 'Wurst, Meteor, LiquidBounce, Impact and all hacked clients.'
        - title: Cheats
          tone: deny
          text: 'Any type of cheat, including X-ray texture packs or mods, Freecam and auto-clickers.'
        - title: PvP enhancements
          tone: deny
          text: 'Projectile trajectories, armor durability displays (showing other players'' armor durability) and fast or quick exp.'
        - title: Vision exploits
          tone: deny
          text: 'Minimaps and world maps, freelook wall clipping, skin layer exploits, pie chart and ray tracing.'
        - title: Automation
          tone: deny
          text: 'Baritone, AI bots and Tweakeroo placement or action automation.'
# ----------------------------------------------------------------------
# FAQ page. To add a question: copy a block ("- q:" and the "a:" under it), paste it under the last one, change the words.
faq:
  - q: 'How do I join from Bedrock Edition (iOS, Android, Xbox, Switch)?'
    a: 'Add a new server on Bedrock with the address `{bedrockHost}` and port `{bedrockPort}` (the default Bedrock port). Consoles hide the Add Server button, so see the How to Join page for help.'
  - q: How does voice chat work?
    a: 'Java players install the [Simple Voice Chat](https://modrinth.com/plugin/simple-voice-chat) mod and press `V` in game. Bedrock players type `/svg` in game, click **Set password**, then go to [voice.morrowcraft.net](https://voice.morrowcraft.net) and connect with their password and their username with a `*` in front. The website and the game must both stay open. The How to Join page has every step.'
  - q: How do I protect my land and builds?
    a: Equip a Golden Shovel or run `/claim` at the corners of your area. You earn claim blocks automatically just by playing on the server.
  - q: Where can I submit a ban appeal or a support ticket?
    a: 'Open a ticket in our Discord at [discord.morrowcraft.net](https://discord.morrowcraft.net). Remember that ban appeals must include evidence.'
  - q: Are store ranks pay to win?
    a: 'No. Ranks are designed to be non pay to win, though they do come with useful perks. All purchases are optional and the money goes towards upkeep and upgrades. Payments are processed securely by Tebex, and we never store your payment details.'
  - q: Can I get a refund?
    a: 'All sales are final and payments are non-refundable unless stated otherwise. Subscription ranks renew automatically unless cancelled before renewal, and you can manage them through Tebex.'
